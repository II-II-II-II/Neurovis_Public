<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neurovis Agent Router</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 20px; 
            margin: 0;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); 
            background-attachment: fixed;
            color: #1d1d1f; 
            display: flex;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .chat-container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            padding: 20px;
            background: rgba(255, 255, 255, 0.5);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            text-align: center;
            font-weight: 600;
            font-size: 1.2rem;
        }
        .upload-section {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.3);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .upload-section input[type="file"] {
            font-size: 0.9rem;
        }
        #engineStatus {
            font-size: 0.85rem;
            color: #666;
            font-weight: 500;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
        }
        .user-msg {
            background: #007aff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .agent-msg {
            background: white;
            color: #1d1d1f;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .input-area {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.5);
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 20px;
            border: 1px solid rgba(0,0,0,0.1);
            background: white;
            font-size: 0.95rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #007aff;
        }
        button {
            background: #007aff;
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .typing-indicator {
            display: none;
            align-self: flex-start;
            color: #888;
            font-size: 0.85rem;
            font-style: italic;
            padding-left: 5px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">Neurovis Multi-Agent Router</div>
    
    <div class="upload-section">
        <label for="dataUpload">Upload Context Data (Apple Health ZIP, Session CSVs, or JSON Backups):</label>
        <input type="file" id="dataUpload" multiple accept=".zip,.xml,.csv,.json" onchange="handleFileUpload(event)">
        <div id="engineStatus">Awaiting Data...</div>
    </div>

    <div class="chat-box" id="chatBox"></div>
    <div class="typing-indicator" id="typingIndicator">Agent is orchestrating...</div>
    
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask about HRV baselines or specific meditation sessions..." onkeypress="handleKeyPress(event)">
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');

    function appendMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender === 'user' ? 'user-msg' : 'agent-msg'}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function handleFileUpload(event) {
        const files = event.target.files;
        if (!files.length) return;

        document.getElementById('engineStatus').innerText = "Uploading payload to edge node...";
        document.getElementById('engineStatus').style.color = "#007aff";

        const formData = new FormData();
        for (let i = 0; i < files.length; i++) {
            formData.append('files', files[i]);
        }

        try {
            const response = await fetch('/upload_context', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            document.getElementById('engineStatus').innerText = data.message || "Data Loaded Successfully";
            document.getElementById('engineStatus').style.color = "#34c759";
            appendMessage(`✅ System: ${data.message}`, 'agent');
        } catch (error) {
            document.getElementById('engineStatus').innerText = "Upload Failed";
            document.getElementById('engineStatus').style.color = "#ff3b30";
            appendMessage(`⚠️ Failed to upload data: ${error.message}`, 'agent');
        }
        
        event.target.value = '';
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;
        typingIndicator.style.display = 'block';
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            
            const data = await response.json();
            appendMessage(data.reply, 'agent');
        } catch (error) {
            appendMessage("⚠️ Connection error. Make sure the Python engine is running.", 'agent');
        } finally {
            typingIndicator.style.display = 'none';
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>
